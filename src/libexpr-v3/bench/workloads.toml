# v3 vs TW benchmark workloads.
#
# Each workload is a top-level table with these fields:
#   kind  = "synthetic" | "nixpkgs" | "lib"
#   expr  = the Nix expression evaluated under `nix eval --expr ...`
#           Substitutions: @NIXPKGS@, @SYSTEM@
#   tags  = list of arbitrary tags (e.g. "compute-bound", "real-world")
#   note  = one-line human description (printed in tables)
#
# Workloads tagged "skip-by-default" are not run unless the user passes
# their name explicitly via `--only` or sets the matching tag via
# `--tag`.
#
# Add new workloads here, never inline in bench.py.  This file is the
# single source of truth.

# -----------------------------------------------------------------------------
# Synthetic compute-bound workloads.
#
# These exercise the inner dispatch loop; pure-v3 (no FFI back to TW).
# They're the primary signal for VM-level optimisations like deferring,
# direct threading, and the getenv-cache.
# -----------------------------------------------------------------------------

[fib25]
kind = "synthetic"
note = "fast fib (~0.05s) — startup-dominated, useful as variance check"
expr = "let f = n: if n < 2 then n else f (n - 1) + f (n - 2); in f 25"
tags = ["compute-bound", "fib"]

[fib30]
kind = "synthetic"
note = "medium fib (~0.4s TW)"
expr = "let f = n: if n < 2 then n else f (n - 1) + f (n - 2); in f 30"
tags = ["compute-bound", "fib"]

[fib33]
kind = "synthetic"
note = "long fib (~1.6s TW) — the headline microbenchmark"
expr = "let f = n: if n < 2 then n else f (n - 1) + f (n - 2); in f 33"
tags = ["compute-bound", "fib"]

[ackermann-3-7]
kind = "synthetic"
note = "deeper recursion than fib; outer arm is tail-call-eligible"
expr = "let a = m: n: if m == 0 then n + 1 else if n == 0 then a (m - 1) 1 else a (m - 1) (a m (n - 1)); in a 3 7"
tags = ["compute-bound", "ackermann"]

# -----------------------------------------------------------------------------
# Synthetic data-shape workloads.
#
# These exercise allocation + attribute access; sub-5ms baseline so
# they're dominated by `nix eval` startup (~52ms on aarch64-darwin).
# Useful for checking we don't accidentally regress simple cases, but
# the absolute numbers are noise.
# -----------------------------------------------------------------------------

[path-deep-30]
kind = "synthetic"
note = "30-deep nested attrset chase; 30 OP_ATTRS_SELECT in a row"
expr = "let mk = n: if n == 0 then { v = 42; } else { x = mk (n - 1); }; r = mk 30; in r.x.x.x.x.x.x.x.x.x.x.x.x.x.x.x.x.x.x.x.x.x.x.x.x.x.x.x.x.x.x.v"
tags = ["data", "attrset"]

[letrec-fix-5]
kind = "synthetic"
note = "lib.fix-style letrec with five mutually-dependent fields"
expr = "let fix = f: let x = f x; in x; mk = self: { a = 1; b = self.a + 1; c = self.b + self.a; d = self.c + self.b; e = self.d + self.c; }; r = fix mk; in [r.a r.b r.c r.d r.e]"
tags = ["data", "letrec"]

[list-build-1k]
kind = "synthetic"
note = "construct a 1000-element list by recursion + ConcatLists"
expr = "let mk = n: if n == 0 then [] else [n] ++ mk (n - 1); in builtins.length (mk 1000)"
tags = ["data", "list"]

[fold-add-10k]
kind = "synthetic"
note = "builtins.foldl' over a 10k-element genList; lib-style compute"
expr = "builtins.foldl' (a: b: a + b) 0 (builtins.genList (x: x) 10000)"
tags = ["data", "list", "primops"]

[with-deep-200]
kind = "synthetic"
note = "200-deep `with` scope chain (lookup at the bottom)"
expr = "let mk = n: if n == 0 then 0 else with { x = n; }; (x + mk (n - 1)); in mk 200"
tags = ["data", "with"]

[attrset-build-1k]
kind = "synthetic"
note = "builds a 1000-key attrset via listToAttrs"
expr = "builtins.length (builtins.attrNames (builtins.listToAttrs (builtins.genList (i: { name = builtins.toString i; value = i; }) 1000)))"
tags = ["data", "attrset", "primops"]

[string-concat-1k]
kind = "synthetic"
note = "concat 1000 short strings via foldl' (++)"
expr = "builtins.stringLength (builtins.foldl' (a: b: a + b) \"\" (builtins.genList (x: builtins.toString x) 1000))"
tags = ["data", "string"]

# -----------------------------------------------------------------------------
# Real-world `lib`-only workloads.
#
# `lib` (== nixpkgs/lib) is loaded directly by the helper expression
# `let lib = import @NIXPKGS@/lib; in <body>`, bypassing the
# pkgs/all-packages.nix tree.  This is intentional: as of 2026-05-09
# the pkgs/all-packages flow tickles a v3 bug at #498 (callPackage
# upvalue regression under thunkify), so full `import nixpkgs {...}`
# fails in both v3-direct and v3-hook modes.  The lib-only subset
# exercises real production lib code (foldl', genAttrs, mapAttrs,
# attrValues, fix) AND completes successfully under v3.
#
# When #498 is closed, add the full pkgs workloads (commented below).
# Until then, lib-only is the load-bearing real-world signal.
# -----------------------------------------------------------------------------

[lib-foldl-1k]
kind = "lib"
note = "lib.foldl' (1..1000) — exercises real lib code, not builtins.foldl'"
expr = "let lib = import @NIXPKGS@/lib; in lib.foldl' (a: b: a + b) 0 (lib.range 1 1000)"
tags = ["real-world", "lib"]

[lib-foldl-10k]
kind = "lib"
note = "lib.foldl' (1..10000) — 10x larger to amortize import cost"
expr = "let lib = import @NIXPKGS@/lib; in lib.foldl' (a: b: a + b) 0 (lib.range 1 10000)"
tags = ["real-world", "lib"]

[lib-genAttrs-100]
kind = "lib"
note = "lib.genAttrs — generates 100-key attrset via lib"
expr = "let lib = import @NIXPKGS@/lib; in builtins.length (builtins.attrNames (lib.genAttrs (lib.genList builtins.toString 100) (n: \"v\" + n)))"
tags = ["real-world", "lib", "attrset"]

[lib-mapAttrs-100]
kind = "lib"
note = "lib.mapAttrs over a 100-key attrset"
expr = "let lib = import @NIXPKGS@/lib; in builtins.length (builtins.attrValues (lib.mapAttrs (k: v: v + 1) (lib.genAttrs (lib.genList builtins.toString 100) (n: builtins.stringLength n))))"
tags = ["real-world", "lib", "attrset"]

[lib-fix-deep]
kind = "lib"
note = "lib.fix on a 5-field self-referential attrset (mirrors module-eval shape)"
expr = "let lib = import @NIXPKGS@/lib; in let r = lib.fix (self: { a = 1; b = self.a + 1; c = self.b + self.a; d = self.c + self.b; e = self.d + self.c; }); in r.e"
tags = ["real-world", "lib", "fix"]

[lib-recursive-update]
kind = "lib"
note = "lib.recursiveUpdate on a 3-deep attrset"
expr = "let lib = import @NIXPKGS@/lib; in (lib.recursiveUpdate { a.b.c = 1; a.b.d = 2; e = 3; } { a.b.c = 10; e = 30; }).a.b.c"
tags = ["real-world", "lib", "attrset"]

[lib-attrnames]
kind = "lib"
note = "count of lib.attrNames — full lib enumeration"
expr = "builtins.length (builtins.attrNames (import @NIXPKGS@/lib))"
tags = ["real-world", "lib", "enumerate"]

[lib-makebinpath]
kind = "lib"
note = "lib.makeBinPath — string concatenation across a list"
expr = "let lib = import @NIXPKGS@/lib; in lib.makeBinPath [\"/p1\" \"/p2\" \"/p3\" \"/p4\" \"/p5\"]"
tags = ["real-world", "lib", "string"]

[lib-evalModules-trivial]
kind = "lib"
note = "lib.evalModules with one option — exercises the NixOS module system core"
expr = "let lib = import @NIXPKGS@/lib; in (lib.evalModules { modules = [ { options.foo = lib.mkOption { type = lib.types.int; default = 42; }; } ]; }).config.foo"
tags = ["real-world", "lib", "modules"]

[lib-evalModules-100]
kind = "lib"
note = "lib.evalModules with 100 options — scales the NixOS module system"
expr = "let lib = import @NIXPKGS@/lib; mods = lib.genList (i: { options.\"opt${toString i}\" = lib.mkOption { type = lib.types.int; default = i; }; }) 100; in builtins.length (builtins.attrNames (lib.evalModules { modules = mods; }).options)"
tags = ["real-world", "lib", "modules"]

[lib-types-int]
kind = "lib"
note = "lib.types.int merge through evalModules — exercises type system"
expr = "let lib = import @NIXPKGS@/lib; in (lib.evalModules { modules = [ { options.x = lib.mkOption { type = lib.types.int; }; config.x = 7; } ]; }).config.x"
tags = ["real-world", "lib", "modules", "types"]

[lib-strings-ops]
kind = "lib"
note = "lib.strings.{splitString, concatStringsSep, removeSuffix} pipeline"
expr = "let lib = import @NIXPKGS@/lib; in lib.strings.concatStringsSep \"-\" (map lib.strings.toUpper (lib.strings.splitString \" \" \"the quick brown fox\"))"
tags = ["real-world", "lib", "string"]

# -----------------------------------------------------------------------------
# Full nixpkgs workloads.
#
# As of 2026-05-18 (Phase 1 closure via Option 4 hybrid), hello.name
# and related light-attr queries are functional under v3-direct at
# parity with TW (~0.6s v3 vs ~0.5s TW).  hello.drvPath and .outPath
# remain slow (>30s vs TW ~1.3s) — tagged perf-known-slow so the
# bench harness includes them for trend tracking without failing CI.
# -----------------------------------------------------------------------------

[hello-name]
kind = "nixpkgs"
note = "canonical real-world — nixpkgs#hello.name (Phase 1 exit criterion)"
expr = "(import @NIXPKGS@ { system = \"@SYSTEM@\"; }).hello.name"
tags = ["real-world", "nixpkgs"]

[hello-pname]
kind = "nixpkgs"
note = "hello.pname — should match hello-name perf"
expr = "(import @NIXPKGS@ { system = \"@SYSTEM@\"; }).hello.pname"
tags = ["real-world", "nixpkgs"]

[hello-version]
kind = "nixpkgs"
note = "hello.version — should match hello-name perf"
expr = "(import @NIXPKGS@ { system = \"@SYSTEM@\"; }).hello.version"
tags = ["real-world", "nixpkgs"]

[hello-meta]
kind = "nixpkgs"
note = "hello.meta.description — light meta-attr access"
expr = "(import @NIXPKGS@ { system = \"@SYSTEM@\"; }).hello.meta.description"
tags = ["real-world", "nixpkgs"]

[hello-system]
kind = "nixpkgs"
note = "hello.system — derivation attr; should be parity"
expr = "(import @NIXPKGS@ { system = \"@SYSTEM@\"; }).hello.system"
tags = ["real-world", "nixpkgs"]

[hello-drvpath]
kind = "nixpkgs"
note = "hello.drvPath — requires deep stdenv chain; v3 currently >30x slow"
expr = "(import @NIXPKGS@ { system = \"@SYSTEM@\"; }).hello.drvPath"
tags = ["real-world", "nixpkgs", "perf-known-slow", "skip-by-default"]

[hello-outpath]
kind = "nixpkgs"
note = "hello.outPath — same depth as drvPath; v3 currently >30x slow"
expr = "(import @NIXPKGS@ { system = \"@SYSTEM@\"; }).hello.outPath"
tags = ["real-world", "nixpkgs", "perf-known-slow", "skip-by-default"]

[attrnames-pkgs]
kind = "nixpkgs"
note = "count of pkgs.attrNames — full top-level enumeration"
expr = "builtins.length (builtins.attrNames (import @NIXPKGS@ { system = \"@SYSTEM@\"; }))"
tags = ["real-world", "nixpkgs", "enumerate"]

# -----------------------------------------------------------------------------
# Derivation-chain synthetic workloads — stress the Option 4 wrapper
# at increasing depth without nixpkgs overhead.
# -----------------------------------------------------------------------------

[derivation-chain-10]
kind = "synthetic"
note = "10-level derivation chain via buildInputs — drvPath of head"
expr = "let mk = n: ds: derivation { name = n; system = \"x86_64-linux\"; builder = \"/bin/sh\"; buildInputs = ds; }; chain = builtins.foldl' (acc: i: acc ++ [(mk (toString i) acc)]) [] (builtins.genList (i: i) 10); in (builtins.elemAt chain 9).drvPath"
tags = ["data", "derivation", "chain"]

[derivation-chain-30]
kind = "synthetic"
note = "30-level derivation chain — drvPath of head"
expr = "let mk = n: ds: derivation { name = n; system = \"x86_64-linux\"; builder = \"/bin/sh\"; buildInputs = ds; }; chain = builtins.foldl' (acc: i: acc ++ [(mk (toString i) acc)]) [] (builtins.genList (i: i) 30); in (builtins.elemAt chain 29).drvPath"
tags = ["data", "derivation", "chain"]

[derivation-strict-multi-output]
kind = "synthetic"
note = "builtins.derivationStrict with 3 outputs — exercises the Option 4 FFI leaf"
expr = "(builtins.derivationStrict { name = \"mout\"; system = \"x86_64-linux\"; builder = \"/bin/sh\"; outputs = [ \"out\" \"dev\" \"doc\" ]; }).drvPath"
tags = ["data", "derivation"]
